<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Cuándo pasa mi micro?</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f6f6f7;--card:#fff;--ink:#17181c;--mut:#767a84;--line:#ececf0;--accent:#e4002b;--go:#e4002b;--r:16px;--navh:68px;--font:'Sora',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.view{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));overflow:auto;display:none}
.view.on{display:block}
#picker{overflow:hidden}
#picker.on{display:flex;flex-direction:column}
.wrap{max-width:640px;margin:0 auto;padding:26px 20px 24px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.hd small{color:var(--mut);font-size:14px}
.hd h1{margin:4px 0 0;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px}

.stop{background:var(--card);border-radius:var(--r);padding:16px 16px 6px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,20,30,.06),0 6px 18px rgba(20,20,30,.05)}
.stop header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding-bottom:6px}
.stop h2{margin:0;font-size:17px;font-weight:600;line-height:1.2}
.code{color:var(--mut);font-size:13.5px}
.near{color:var(--accent);font-size:13px;font-weight:600;margin-top:2px}
.edit{color:var(--mut);font-size:14px;padding:4px 8px;border-radius:8px}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:14px;padding:13px 0}
.row+.row{border-top:1px solid var(--line)}
.svc{flex:none;min-width:56px;text-align:center;padding:5px 8px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:18px}
.row.off .svc{background:#c9ccd3}
.eta{font-weight:300;font-size:30px;line-height:1;letter-spacing:-.02em}
.eta small{font-size:14px;font-weight:400;color:var(--mut);margin-right:5px;letter-spacing:0}
.eta.go{color:var(--go);font-weight:600;font-size:26px}
.eta.none{color:var(--mut);font-size:17px;font-weight:400;letter-spacing:0}
.sub{color:var(--mut);font-size:13.5px;margin-top:4px}
.err{color:var(--accent);font-size:13.5px;padding:0 0 12px}
.skeleton{color:var(--mut);padding:12px 0;font-size:15px}
.empty{background:var(--card);border-radius:var(--r);padding:30px 20px;text-align:center;box-shadow:0 1px 2px rgba(20,20,30,.06),0 6px 18px rgba(20,20,30,.05)}
.empty h2{margin:0 0 6px;font-size:20px;font-weight:600}
.empty p{margin:0 0 16px;color:var(--mut);font-size:15px}
.btn{background:var(--accent);color:#fff;border-radius:var(--r);padding:12px 18px;font-weight:600;font-size:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--accent);border:1px solid var(--accent)}

/* mapa */
.mapbox{position:relative;flex:1;overflow:hidden}
#map{position:absolute;inset:0}
.search{position:absolute;left:12px;right:12px;top:12px;z-index:600;display:flex;gap:8px;align-items:center;background:var(--card);border-radius:var(--r);padding:6px 6px 6px 14px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.search svg{flex:none;color:var(--mut)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:8px 0;text-transform:uppercase}
.search input::placeholder{text-transform:none;color:var(--mut)}
.search button{background:var(--accent);color:#fff;border-radius:11px;padding:9px 14px;font-weight:600;font-size:14px}
#hint{position:absolute;left:12px;right:12px;top:68px;z-index:500;background:var(--card);color:var(--mut);border-radius:12px;padding:8px 12px;font-size:13.5px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08);pointer-events:none}
.locate{position:absolute;left:12px;bottom:12px;z-index:500;box-shadow:0 2px 10px rgba(0,0,0,.12)}
#sheet{position:absolute;left:12px;right:12px;bottom:12px;z-index:1100;background:var(--card);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.18);padding:16px;max-height:72%;overflow:auto;transform:translateY(120%);transition:transform .22s ease-out}
#sheet.open{transform:none}
#sheet h3{margin:0 0 2px;font-size:17px;font-weight:600;line-height:1.2}
.codeline{display:flex;gap:8px;margin:10px 0}
.codeline input,.manual input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;text-transform:uppercase}
.msg{color:var(--mut);font-size:13.5px;margin:6px 0}
.msg.bad{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 14px;font-weight:600;font-size:17px;min-width:60px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.dim{opacity:.55}
.manual{display:flex;gap:8px;margin-top:8px}
.manual input{flex:none;width:120px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1}
.leaflet-container{font-family:var(--font)}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:1fr 1fr;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:1200;color:#a2a6af}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:600;position:relative}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current=page]{color:var(--accent)}
.nav button[aria-current=page]::after{content:"";position:absolute;top:7px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>
<body>

<main class="view on" id="home">
  <div class="wrap">
    <div class="hd">
      <div><small id="upd">Cargando…</small><h1>Mi paradero</h1></div>
      <button class="icon-btn" id="refresh" aria-label="Actualizar ahora">Actualizar</button>
    </div>
    <div id="stops"></div>
  </div>
</main>

<section class="view" id="picker" aria-label="Agregar micro">
  <div class="mapbox">
    <div id="map"></div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="qcode" placeholder="Buscar por código (ej. PA433)" autocomplete="off" aria-label="Código de paradero">
      <button id="qgo">Buscar</button>
    </div>
    <div id="hint">Acerca el mapa para ver los paraderos</div>
    <button class="icon-btn locate" id="locate">Mi ubicación</button>
    <div id="sheet" role="dialog" aria-live="polite"></div>
  </div>
</section>

<nav class="nav" aria-label="Principal">
  <button id="n-home" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7.5 9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg>Inicio
  </button>
  <button id="n-add" aria-current="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z"/><path d="M12 7.5v5M9.5 10h5"/></svg>Agregar micro
  </button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
'use strict';
const KEY='paradero-home-v1';
const API='https://api.xor.cl/red/bus-stop/';
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- almacenamiento local ---------- */
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.stops))return s}catch(e){}return{stops:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

/* ---------- API ---------- */
async function fetchStop(code){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),12000);
  try{
    const r=await fetch(API+encodeURIComponent(code),{signal:ctl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally{clearTimeout(t)}
}

/* ---------- inicio ---------- */
const arrivals={}; // code -> {data,error,loading}
let lastUpdate=null;

function fmtDist(m){if(m==null)return'';return m<1000?`${Math.round(m)} m`:`${(m/1000).toFixed(1).replace('.',',')} km`}
function eta(b){
  if(!b) return null;
  const mn=b.min_arrival_time, mx=b.max_arrival_time;
  if(mn==null&&mx==null) return null;
  const lo=mn??mx, hi=mx??mn;
  if(hi<=1&&lo<=1) return {sort:0,go:true,txt:'Llegando'};
  return {sort:lo,go:false,txt:(lo===hi?`${lo}`:`${lo}–${hi}`)+' min'};
}
function serviceInfo(code,id){
  const d=arrivals[code]?.data; if(!d||!Array.isArray(d.services)) return null;
  return d.services.find(s=>String(s.id).toUpperCase()===id)||null;
}

let here=null;
function distTo(st){
  if(!here||st.lat==null||st.lng==null) return null;
  const R=6371000,rad=x=>x*Math.PI/180,dl=rad(st.lat-here.lat),dg=rad(st.lng-here.lng);
  const a=Math.sin(dl/2)**2+Math.cos(rad(here.lat))*Math.cos(rad(st.lat))*Math.sin(dg/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function ordered(){
  return state.stops.map((st,i)=>({st,i,d:distTo(st)}))
    .sort((a,b)=>(a.d??Infinity)-(b.d??Infinity)||a.i-b.i).map(x=>x.st);
}
function locateHome(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    p=>{here={lat:p.coords.latitude,lng:p.coords.longitude};renderHome()},
    ()=>{},{timeout:8000,maximumAge:60000});
}

function renderHome(){
  const box=$('#stops');
  if(!state.stops.length){
    box.innerHTML=`<div class="empty"><h2>Aún no tienes paraderos</h2><p>Elige uno en el mapa y marca las micros que te sirven. Esta página te dirá en cuántos minutos viene cada una.</p><button class="btn" id="add2">Elegir paradero</button></div>`;
    $('#add2').onclick=()=>openPicker();
    $('#upd').textContent='Sin paraderos guardados';
    return;
  }
  box.innerHTML=ordered().map((st,i,arr)=>{
    const d=distTo(st);
    const near=d==null?'':`<div class="near">${i===0&&arr.length>1?'Más cercano · ':''}a ${fmtDist(d)}</div>`;
    const a=arrivals[st.code]||{};
    const name=a.data?.name||st.name||'Paradero';
    const rows=st.services.map(id=>{
      const s=serviceInfo(st.code,id);
      const first=s?.buses?.[0], second=s?.buses?.[1];
      const e=eta(first), e2=eta(second);
      let main,sub,cls='';
      if(e){
        main=`<div class="eta ${e.go?'go':''}">${e.go?'':'<small>en</small>'}${esc(e.txt)}</div>`;
        sub=[fmtDist(first.meters_distance),first.id,e2?`siguiente: ${e2.txt==='Llegando'?'llegando':'en '+e2.txt}`:''].filter(Boolean).join(' · ');
      }else if(!arrivals[st.code]?.data){
        main=`<div class="eta none">${a.loading?'Consultando…':'—'}</div>`;sub='';
      }else{
        main=`<div class="eta none">Sin micros próximas</div>`;
        sub=s?.status_description&&!/ok|horario/i.test(s.status_description)?s.status_description:(s?'':'Esta micro no aparece hoy en este paradero');
        if(s&&s.valid===false) cls='off';
      }
      return `<li class="row ${cls}"><span class="svc">${esc(id)}</span><div>${main}<div class="sub">${esc(sub)}</div></div></li>`;
    }).join('');
    return `<article class="stop">
      <header><div><h2>${esc(name)}</h2><span class="code">${esc(st.code)}</span>${near}</div><button class="edit" data-code="${esc(st.code)}">Editar</button></header>
      <ul class="rows">${rows||'<li class="skeleton">Sin micros elegidas</li>'}</ul>
      ${a.error?`<div class="err">${esc(a.error)}</div>`:''}
    </article>`;
  }).join('');
  box.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openPicker(state.stops.find(x=>x.code===b.dataset.code)));
  $('#upd').textContent=lastUpdate?`Actualizado ${lastUpdate.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`:'Consultando…';
}

async function refreshAll(){
  locateHome();
  if(!state.stops.length){renderHome();return}
  state.stops.forEach(s=>{arrivals[s.code]={...(arrivals[s.code]||{}),loading:true}});
  renderHome();
  await Promise.all(state.stops.map(async s=>{
    try{
      const data=await fetchStop(s.code);
      arrivals[s.code]={data,loading:false};
      if(data.name&&data.name!==s.name){s.name=data.name;save()}
    }catch(e){
      arrivals[s.code]={...arrivals[s.code],loading:false,error:'No se pudo actualizar. Se reintenta solo cada 30 segundos.'};
    }
  }));
  lastUpdate=new Date(); renderHome();
}

$('#refresh').onclick=refreshAll;
setInterval(()=>{if(!document.hidden&&!$('#picker').classList.contains('on'))refreshAll()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#picker').classList.contains('on'))refreshAll()});

/* ---------- selector con mapa ---------- */
let map=null, layer=null, markers=new Map(), selMarker=null, loadTimer=null, sel=null;
const STYLE={fillColor:'#e4002b',color:'#ffffff',weight:3,fillOpacity:1,radius:9};
const STYLE_NOCODE={fillColor:'#a2a6af',color:'#ffffff',weight:2,fillOpacity:.9,radius:7};
const STYLE_SEL={fillColor:'#17181c',color:'#ffffff',weight:3,fillOpacity:1,radius:12};

function initMap(){
  if(map) return;
  map=L.map('map',{zoomControl:false}).setView([-33.4489,-70.6693],15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  layer=L.layerGroup().addTo(map);
  map.on('moveend',()=>{clearTimeout(loadTimer);loadTimer=setTimeout(loadStops,350)});
}
function openPicker(stop){
  setNav(true);
  initMap();
  setTimeout(()=>{
    map.invalidateSize();
    if(stop&&stop.lat!=null) map.setView([stop.lat,stop.lng],17);
    else if(!stop&&!openPicker.did){openPicker.did=true;locate(true)}
    loadStops();
  },60);
  if(stop) openSheet(stop); else closeSheet();
}
function setNav(add){
  $('#home').classList.toggle('on',!add);$('#picker').classList.toggle('on',add);
  $('#n-home').setAttribute('aria-current',add?'false':'page');
  $('#n-add').setAttribute('aria-current',add?'page':'false');
}
function closePicker(){setNav(false);closeSheet();refreshAll()}
$('#n-home').onclick=()=>{if($('#picker').classList.contains('on'))closePicker()};
$('#n-add').onclick=()=>{if(!$('#picker').classList.contains('on'))openPicker()};

function locate(silent){
  if(!navigator.geolocation){ if(!silent)alert('Tu navegador no permite obtener la ubicación.');return}
  navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],17),()=>{},{timeout:8000});
}
$('#locate').onclick=()=>locate(false);

function extractCode(tags){
  const re=/\bP[A-Z]\d{1,5}\b/i;
  for(const k of ['ref','ref:red','ref:transantiago','ref:cl','official_ref','local_ref','name']){
    const m=tags[k]&&String(tags[k]).match(re); if(m) return m[0].toUpperCase();
  }
  for(const v of Object.values(tags)){const m=String(v).match(re);if(m)return m[0].toUpperCase()}
  return null;
}

async function loadStops(){
  const hint=$('#hint');
  if(map.getZoom()<16){hint.style.display='block';hint.textContent='Acerca el mapa para ver los paraderos';return}
  const b=map.getBounds();
  const q=`[out:json][timeout:25];node["highway"="bus_stop"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});out body 500;`;
  hint.style.display='block';hint.textContent='Buscando paraderos…';
  let json=null;
  for(const url of OVERPASS){
    try{
      const r=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});
      if(r.ok){json=await r.json();break}
    }catch(e){}
  }
  if(!json){hint.textContent='No se pudieron cargar los paraderos. Usa el buscador por código.';return}
  json.elements.forEach(el=>{
    if(markers.has(el.id)) return;
    const code=extractCode(el.tags||{});
    const m=L.circleMarker([el.lat,el.lon],code?STYLE:STYLE_NOCODE).addTo(layer);
    m.meta={code,name:el.tags?.name||'',lat:el.lat,lng:el.lon,base:code?STYLE:STYLE_NOCODE};
    m.on('click',()=>{
      if(selMarker) selMarker.setStyle(selMarker.meta.base);
      selMarker=m; m.setStyle(STYLE_SEL); m.bringToFront();
      const saved=state.stops.find(s=>s.code===m.meta.code);
      openSheet(saved||{code:m.meta.code||'',name:m.meta.name,lat:m.meta.lat,lng:m.meta.lng,services:[]});
    });
    markers.set(el.id,m);
  });
  hint.style.display='none';
}

/* ---------- hoja inferior ---------- */
function closeSheet(){$('#sheet').classList.remove('open');sel=null;if(selMarker){selMarker.setStyle(selMarker.meta.base);selMarker=null}}

function openSheet(stop){
  const saved=state.stops.find(s=>s.code===stop.code);
  sel={code:stop.code||'',name:stop.name||'',lat:stop.lat??null,lng:stop.lng??null,
       chosen:new Set((saved?saved.services:stop.services||[]).map(String)),
       available:[],status:'idle',saved:!!saved};
  renderSheet();
  $('#sheet').classList.add('open');
  if(sel.code) lookup();
}

async function lookup(){
  const code=sel.code.trim().toUpperCase(); if(!code) return;
  sel.code=code; sel.status='loading'; renderSheet();
  try{
    const d=await fetchStop(code);
    if(sel.code!==code) return;
    if(d.name) sel.name=d.name;
    sel.available=(d.services||[]).map(s=>({id:String(s.id).toUpperCase(),valid:s.valid!==false}));
    sel.status=sel.available.length?'ok':'empty';
  }catch(e){ if(sel.code===code) sel.status='error' }
  renderSheet();
}

function renderSheet(){
  if(!sel) return;
  const ids=[...new Set([...sel.available.map(s=>s.id),...sel.chosen])].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
  const dim=id=>{const s=sel.available.find(x=>x.id===id);return s&&!s.valid};
  let msg='';
  if(!sel.code) msg='<p class="msg">Este paradero no tiene código en el mapa. Escríbelo abajo: está en el letrero del paradero.</p>';
  else if(sel.status==='loading') msg='<p class="msg">Buscando micros…</p>';
  else if(sel.status==='error') msg='<p class="msg bad">No pude consultar ese código. Revisa que esté bien escrito y tu conexión.</p>';
  else if(sel.status==='empty') msg='<p class="msg">No hay micros informadas ahora (puede ser de noche). Puedes agregarlas a mano.</p>';
  else if(sel.status==='ok') msg='<p class="msg">Toca las micros que quieres ver en tu inicio.</p>';
  $('#sheet').innerHTML=`
    <h3>${esc(sel.name||'Paradero')}</h3>
    <div class="codeline"><input id="scode" value="${esc(sel.code)}" placeholder="Código (ej. PA433)" autocomplete="off" aria-label="Código del paradero"><button class="icon-btn" id="sgo">Buscar micros</button></div>
    ${msg}
    <div class="chips">${ids.map(id=>`<button class="chip ${dim(id)?'dim':''}" data-id="${esc(id)}" aria-pressed="${sel.chosen.has(id)}">${esc(id)}</button>`).join('')}</div>
    ${sel.code?`<div class="manual"><input id="sman" placeholder="Otra micro" aria-label="Agregar micro a mano"><button class="icon-btn" id="sadd">Agregar</button></div>`:''}
    <div class="actions">
      <button class="btn" id="ssave" ${sel.chosen.size&&sel.code?'':'disabled'}>Guardar en mi inicio</button>
      ${sel.saved?'<button class="btn danger" id="sdel">Quitar paradero</button>':'<button class="btn ghost" id="scancel">Cancelar</button>'}
    </div>`;
  const $s=s=>$('#sheet').querySelector(s);
  $s('#scode').addEventListener('input',e=>{sel.code=e.target.value.toUpperCase()});
  $s('#scode').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});
  $s('#sgo').onclick=()=>{sel.code=$s('#scode').value;lookup()};
  $('#sheet').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const id=c.dataset.id; sel.chosen.has(id)?sel.chosen.delete(id):sel.chosen.add(id); renderSheet();
  });
  const add=()=>{const v=($s('#sman').value||'').trim().toUpperCase();if(v){sel.chosen.add(v);renderSheet()}};
  if($s('#sadd')){$s('#sadd').onclick=add;$s('#sman').addEventListener('keydown',e=>{if(e.key==='Enter')add()})}
  $s('#ssave').onclick=()=>{
    const code=$s('#scode').value.trim().toUpperCase(); if(!code||!sel.chosen.size) return;
    const rec={code,name:sel.name,lat:sel.lat,lng:sel.lng,services:[...sel.chosen]};
    const i=state.stops.findIndex(s=>s.code===code);
    i>=0?state.stops[i]=rec:state.stops.push(rec);
    save(); closePicker();
  };
  if($s('#sdel')) $s('#sdel').onclick=()=>{
    state.stops=state.stops.filter(s=>s.code!==sel.code); delete arrivals[sel.code]; save(); closePicker();
  };
  if($s('#scancel')) $s('#scancel').onclick=closeSheet;
}

$('#qgo').onclick=()=>{const v=$('#qcode').value.trim().toUpperCase();if(v)openSheet({code:v})};
$('#qcode').addEventListener('keydown',e=>{if(e.key==='Enter')$('#qgo').click()});

/* ---------- arranque ---------- */
renderHome();
refreshAll();
})();
</script>
</body>
</html>
